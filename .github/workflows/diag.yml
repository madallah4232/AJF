          {
          for u in "https://api.allorigins.win/raw?url=https%3A%2F%2Fapi.adsb.lol%2Fv2%2Fcallsign%2FSVA1383" "https://corsproxy.io/?url=https%3A%2F%2Fapi.adsb.lol%2Fv2%2Fcallsign%2FSVA1383" "https://api.codetabs.com/v1/proxy/?quest=https://api.adsb.lol/v2/callsign/SVA1383" "https://api.adsb.one/v2/callsign/SVA1383" "https://api.adsb.fi/v2/callsign/SVA1383" "https://opendata.adsb.fi/api/v2/callsign/SVA1383" "https://globe.adsbexchange.com/" ; do
