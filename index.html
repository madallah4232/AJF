<style>
/* Layout idea: a night-shift departures board — live "next departure" up top, a week strip that reads as a pressure chart, a day timeline, then the board itself. */
:root{
  --night:#0a1120;      /* page */
  --panel:#111a2c;      /* cards */
  --raise:#17223a;      /* pressed / inputs */
  --line:#223050;       /* hairlines */
  --ink:#e9eef7;        /* text */
  --muted:#8796b0;      /* secondary text */
  --amber:#ffb340;      /* board digits, the one accent */
  --go:#38d39f;         /* departed / ok */
  --warn:#ff7a66;       /* suspended / attention */
  --display:"Readex Pro","IBM Plex Sans Arabic",system-ui,sans-serif;
  --body:"IBM Plex Sans Arabic",system-ui,-apple-system,"Segoe UI",Tahoma,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,"SF Mono",Menlo,monospace;
  --ease:cubic-bezier(.23,1,.32,1);
  color-scheme:dark;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--night);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.5}
body{min-height:100%;padding-bottom:env(safe-area-inset-bottom)}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
:focus-visible{outline:2px solid var(--amber);outline-offset:2px;border-radius:8px}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums;letter-spacing:.02em}
.wrap{max-width:560px;margin:0 auto;padding:0 16px 40px;display:grid;gap:18px}

/* top bar */
.top{position:sticky;top:0;z-index:5;margin:0 -16px;padding:calc(env(safe-area-inset-top) + 14px) 16px 12px;
  background:color-mix(in oklab,var(--night) 82%,transparent);backdrop-filter:saturate(160%) blur(18px);-webkit-backdrop-filter:saturate(160%) blur(18px);
  border-bottom:1px solid transparent;transition:border-color .2s}
.top.scrolled{border-color:var(--line)}
.bar{display:flex;align-items:center;justify-content:space-between;gap:12px}
.brand{display:flex;flex-direction:column}
.brand small{color:var(--muted);font-size:12px;letter-spacing:.04em}
.brand h1{margin:0;font-family:var(--display);font-weight:700;font-size:24px;line-height:1.2;text-wrap:balance}
.clock{text-align:left;display:flex;flex-direction:column;align-items:flex-end}
.clock b{font-family:var(--mono);font-size:22px;color:var(--amber);font-weight:600;font-variant-numeric:tabular-nums}
.clock span{font-size:11px;color:var(--muted)}
.search{margin-top:12px;display:flex;align-items:center;gap:8px;background:var(--raise);border:1px solid var(--line);border-radius:12px;padding:0 12px;height:42px}
.search svg{width:16px;height:16px;color:var(--muted);flex:none}
.search input{flex:1;min-width:0;background:none;border:0;outline:0;color:var(--ink);font:inherit;font-size:15px}
.search input::placeholder{color:var(--muted)}
.search input::-webkit-search-cancel-button{display:none}
.clear{width:22px;height:22px;border-radius:50%;background:var(--line);color:var(--muted);font-size:11px;display:none;place-items:center}
.clear.show{display:grid}

/* next departure */
.next{position:relative;overflow:hidden;background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:18px;display:grid;gap:14px}
.next::before{content:"";position:absolute;inset:0 0 auto 0;height:3px;background:var(--amber)}
.next .lbl{display:flex;justify-content:space-between;align-items:center;color:var(--muted);font-size:12px}
.pulse{display:inline-flex;align-items:center;gap:6px;color:var(--amber);font-weight:600}
.pulse i{width:7px;height:7px;border-radius:50%;background:var(--amber);animation:pulse 1.6s var(--ease) infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 color-mix(in oklab,var(--amber) 60%,transparent)}100%{box-shadow:0 0 0 9px transparent}}
.next .main{display:grid;grid-template-columns:auto 1fr;gap:16px;align-items:center}
.board{display:flex;gap:3px;direction:ltr}
.board span{font-family:var(--mono);font-weight:600;font-size:30px;width:30px;height:42px;display:grid;place-items:center;border-radius:6px;
  background:linear-gradient(#0b1323 50%,#0e1729 50%);color:var(--amber);box-shadow:inset 0 0 0 1px var(--line)}
.next h2{margin:0;font-family:var(--display);font-size:26px;line-height:1.15;font-weight:700}
.next .sub{color:var(--muted);font-size:13px}
.next .foot{display:flex;justify-content:space-between;align-items:baseline;border-top:1px dashed var(--line);padding-top:12px}
.next .count{font-family:var(--mono);font-size:18px;color:var(--ink)}
.next .count small{font-family:var(--body);color:var(--muted);font-size:12px;margin-inline-start:6px}

/* week strip */
.sec{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.sec h3{margin:0;font-family:var(--display);font-size:17px;font-weight:600}
.sec small{color:var(--muted);font-size:12px}
.weeknav{display:flex;gap:6px}
.weeknav button{width:32px;height:32px;border-radius:10px;background:var(--panel);border:1px solid var(--line);color:var(--ink);display:grid;place-items:center;transition:transform .16s var(--ease),opacity .2s}
.weeknav button:active{transform:scale(.94)}
.weeknav button:disabled{opacity:.35;cursor:default}
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.day{position:relative;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:8px 4px 6px;display:grid;justify-items:center;gap:4px;
  transition:transform .16s var(--ease),background .2s,border-color .2s}
.day:active{transform:scale(.96)}
.day .dn{font-size:11px;color:var(--muted)}
.day .dd{font-family:var(--mono);font-size:15px;font-weight:600}
.day .meter{width:100%;height:34px;display:flex;align-items:flex-end;justify-content:center}
.day .meter i{width:14px;border-radius:4px 4px 2px 2px;background:color-mix(in oklab,var(--muted) 45%,transparent);transition:height .4s var(--ease)}
.day .dc{font-family:var(--mono);font-size:12px;color:var(--muted)}
.day.peak .meter i{background:var(--warn)}
.day[aria-pressed="true"]{background:var(--raise);border-color:var(--amber)}
.day[aria-pressed="true"] .meter i{background:var(--amber)}
.day.today .dn{color:var(--amber);font-weight:600}
.legend{display:flex;gap:14px;color:var(--muted);font-size:11px;flex-wrap:wrap}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:10px;height:10px;border-radius:3px;display:inline-block}

/* timeline */
.tl{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:14px 14px 10px;display:grid;gap:8px}
.tl .track{position:relative;height:50px}
.tl .axis{position:absolute;inset:auto 0 20px 0;height:1px;background:var(--line)}
.tl .tick{position:absolute;bottom:0;transform:translateX(50%);font-family:var(--mono);font-size:10px;color:var(--muted)}
.tl .tick::before{content:"";position:absolute;bottom:16px;right:50%;width:1px;height:5px;background:var(--line)}
.tl .dot{position:absolute;bottom:15px;width:10px;height:10px;margin-right:-5px;border-radius:50%;background:var(--amber);box-shadow:0 0 0 3px var(--panel)}
.tl .dot.done{background:var(--muted)}
.tl .dot.est{background:transparent;box-shadow:inset 0 0 0 2px var(--amber),0 0 0 3px var(--panel)}
.tl .now{position:absolute;top:0;bottom:20px;width:2px;margin-right:-1px;background:var(--go);border-radius:2px}
.tl .now::after{content:"الآن";position:absolute;top:-2px;right:6px;font-size:10px;color:var(--go);white-space:nowrap}
.tl .rush{position:absolute;bottom:20px;height:26px;background:color-mix(in oklab,var(--warn) 16%,transparent);border-radius:6px 6px 0 0}
.tl p{margin:0;color:var(--muted);font-size:12px}
.tl p b{color:var(--ink);font-weight:600}

/* stats */
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:10px 12px}
.stat b{display:block;font-family:var(--mono);font-size:20px;font-weight:600}
.stat span{font-size:11px;color:var(--muted)}

/* board list */
.list{display:grid;gap:8px}
.row{position:relative;display:grid;grid-template-columns:64px 1fr auto;gap:12px;align-items:center;text-align:right;width:100%;
  background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:12px 14px 12px 12px;overflow:hidden;
  transition:transform .16s var(--ease),background .2s;animation:in .42s var(--ease) both}
.row:active{transform:scale(.98);background:var(--raise)}
.row::before{content:"";position:absolute;inset:10px 0 10px auto;width:3px;border-radius:3px 0 0 3px;background:var(--c,var(--muted))}
@keyframes in{from{opacity:.001;transform:translateY(6px)}}
.row .t{font-family:var(--mono);font-size:20px;font-weight:600;color:var(--amber);font-variant-numeric:tabular-nums}
.row .t small{display:block;font-family:var(--body);font-size:10px;color:var(--muted);font-weight:500}
.row .d{min-width:0}
.row .d b{font-family:var(--display);font-size:17px;font-weight:600}
.row .d .code{font-family:var(--mono);font-size:12px;color:var(--muted);margin-inline-start:6px}
.row .d div{color:var(--muted);font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.al{display:inline-grid;place-items:center;min-width:30px;height:20px;padding:0 6px;margin-inline-end:6px;border-radius:6px;vertical-align:1px;font-family:var(--mono);font-size:11px;font-weight:600;letter-spacing:.04em;color:#0a1120;background:var(--c,var(--muted))}
.al.lg{min-width:40px;height:26px;font-size:13px;border-radius:8px}
.side{display:grid;justify-items:center;gap:5px}
.side small{font-size:11px;color:var(--muted)}
.chip{font-size:11px;font-weight:600;padding:4px 8px;border-radius:999px;white-space:nowrap;border:1px solid currentColor}
.chip.sched{color:var(--muted)}
.chip.soon{color:var(--amber)}
.chip.done{color:var(--go)}
.chip.off,.chip.cxl{color:var(--warn)}
.chip.air{color:#7cc4ff}
.chip.live::before{content:"";display:inline-block;width:6px;height:6px;border-radius:50%;background:currentColor;margin-inline-end:5px;vertical-align:1px}
.row.cxl .t{color:var(--muted);text-decoration:line-through;text-decoration-color:var(--warn)}
.track-btn{display:flex;align-items:center;justify-content:center;gap:8px;height:44px;border-radius:14px;border:1px solid var(--line);background:var(--raise);color:var(--ink);font-weight:600;text-decoration:none;transition:transform .16s var(--ease)}
.track-btn[hidden]{display:none}
.track-btn:active{transform:scale(.97)}
.sync{justify-self:center;display:flex;align-items:center;gap:12px;padding:10px 18px 10px 14px;border-radius:999px;background:var(--panel);border:1px solid var(--line);margin-top:6px}
.sync b{display:block;font-size:13px;font-weight:600;color:var(--go)}
.sync span{font-size:12px;color:var(--muted)}
.sync.stale b{color:var(--amber)}
.beacon{position:relative;width:12px;height:12px;flex:none}
.beacon i,.beacon::before,.beacon::after{position:absolute;inset:0;border-radius:50%;background:var(--go)}
.beacon::before,.beacon::after{content:"";opacity:.6;animation:ping 2.4s cubic-bezier(.2,.6,.3,1) infinite}
.beacon::after{animation-delay:1.2s}
.sync.stale .beacon i,.sync.stale .beacon::before,.sync.stale .beacon::after{background:var(--amber)}
@keyframes ping{0%{transform:scale(1);opacity:.6}100%{transform:scale(3.2);opacity:0}}
.row.past{opacity:.55}
.row.past .t{color:var(--muted)}
.row.off .t{color:var(--muted);text-decoration:line-through;text-decoration-color:var(--warn)}
mark{background:color-mix(in oklab,var(--amber) 30%,transparent);color:inherit;border-radius:3px}
.empty{color:var(--muted);text-align:center;padding:28px 12px;border:1px dashed var(--line);border-radius:16px}
.alert{display:flex;gap:10px;align-items:flex-start;background:color-mix(in oklab,var(--warn) 10%,var(--panel));border:1px solid color-mix(in oklab,var(--warn) 35%,var(--line));border-radius:14px;padding:12px 14px;font-size:13px}
.alert b{color:var(--warn)}
.foot{color:var(--muted);font-size:12px;line-height:1.8}

/* sheet */
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.5);opacity:0;pointer-events:none;z-index:9}
.scrim.on{pointer-events:auto}
.sheet{position:fixed;inset:auto 0 0 0;z-index:10;max-width:560px;margin:0 auto;background:var(--panel);border:1px solid var(--line);border-bottom:0;border-radius:22px 22px 0 0;
  padding:8px 18px calc(18px + env(safe-area-inset-bottom));transform:translateY(calc(100% + 60px));touch-action:pan-y;display:grid;gap:12px;max-height:92dvh;overflow-y:auto;overscroll-behavior:contain}
.grab,#shT,#shS{touch-action:none}
.grab{width:38px;height:5px;border-radius:3px;background:var(--line);margin:4px auto 6px}
.sheet h4{margin:0;font-family:var(--display);font-size:22px}
.sheet .s{color:var(--muted);font-size:13px;margin-top:-8px}
.kv{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.kv div{background:var(--raise);border-radius:12px;padding:10px 12px}
.kv span{display:block;font-size:11px;color:var(--muted)}
.kv b{font-family:var(--body);font-variant-numeric:tabular-nums;font-size:17px;font-weight:600}
.dots{display:flex;gap:6px;justify-content:space-between}
.dots i{flex:1;text-align:center;font-style:normal;font-size:12px;padding:7px 0;border-radius:9px;background:var(--raise);color:var(--muted)}
.dots i.on{background:color-mix(in oklab,var(--amber) 22%,var(--raise));color:var(--amber);font-weight:600}
.sheet .note{font-size:13px;color:var(--muted);line-height:1.7}
/* turnaround countdown */
.turn{background:linear-gradient(180deg,color-mix(in oklab,var(--amber) 9%,var(--raise)),var(--raise));border:1px solid color-mix(in oklab,var(--amber) 28%,var(--line));border-radius:16px;padding:12px 14px;display:grid;gap:10px}
.turn[hidden]{display:none}
.tu-h{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:12px;color:var(--muted)}
.tu-h b{font-family:var(--display);font-size:14px;color:var(--ink);font-weight:600}
.tu-src{font-size:11px;padding:3px 8px;border-radius:99px;background:color-mix(in oklab,var(--go) 16%,transparent);color:var(--go);white-space:nowrap}
.tu-src.ap{background:color-mix(in oklab,var(--amber) 16%,transparent);color:var(--amber)}
.tu-big{display:flex;align-items:baseline;justify-content:space-between;gap:10px}
.tu-big span{font-size:12px;color:var(--muted)}
.tu-big b{font-family:var(--mono);font-size:40px;line-height:1;font-weight:600;color:var(--amber);letter-spacing:1px;font-variant-numeric:tabular-nums;direction:ltr}
.tu-big b.ok{color:var(--go)}.tu-big b.late{color:var(--warn)}
.tu-bar{display:flex;gap:3px;height:8px;direction:rtl}
.tu-bar i{position:relative;border-radius:4px;background:color-mix(in oklab,var(--pc) 22%,var(--panel));overflow:hidden}
.tu-bar i::after{content:"";position:absolute;inset:0 0 0 auto;width:var(--f,0%);background:var(--pc);border-radius:4px}
.tu-ph{list-style:none;margin:0;padding:0;display:grid;gap:2px}
.tu-ph li{display:grid;grid-template-columns:10px 1fr auto auto;align-items:center;gap:8px;font-size:13px;padding:5px 0;color:var(--muted)}
.tu-ph li i{width:8px;height:8px;border-radius:50%;background:var(--pc);opacity:.45}
.tu-ph li.now{color:var(--ink)}.tu-ph li.now i{opacity:1;box-shadow:0 0 0 4px color-mix(in oklab,var(--pc) 25%,transparent);animation:pulse 1.6s infinite}
.tu-ph li.done{opacity:.6}.tu-ph li.done i{opacity:1}
.tu-ph li b{font-weight:500}.tu-ph li.now b{font-weight:700}
.tu-ph .num{font-family:var(--mono);font-size:12px;direction:ltr}
.tu-ph em{font-style:normal;font-size:12px;min-width:66px;text-align:left;font-family:var(--mono);direction:ltr}
.tu-ph li.now em{color:var(--amber)}.tu-ph li.done em{color:var(--go)}
.tu-n{font-size:12px;color:var(--muted);line-height:1.6}
.tu-n b{color:var(--warn)}
/* coordination sheet */
.cs{position:fixed;inset:0;z-index:31;background:var(--night);overflow-y:auto;overflow-x:hidden;overscroll-behavior:contain}
.cs[hidden]{display:none}
.cs .trk-top{position:sticky;top:0;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
.cs-body{max-width:560px;margin:0 auto;padding:14px 14px calc(110px + env(safe-area-inset-bottom));display:grid;gap:14px}
.cs-card{min-width:0;background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:12px;display:grid;gap:10px}
.cs-card h5{margin:0;font:600 13px var(--display);color:var(--muted);letter-spacing:.3px;display:flex;justify-content:space-between;align-items:center}
.cs-g{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.cs-g.two{grid-template-columns:repeat(2,minmax(0,1fr))}
.cs-f{display:grid;gap:3px}
.cs-f span{font-size:10.5px;color:var(--muted);font-family:var(--mono);letter-spacing:.2px;direction:ltr;text-align:right}
.cs-f input,.cs-f select{height:40px;min-width:0;width:100%;border-radius:10px;border:1px solid var(--line);background:var(--raise);color:var(--ink);font:600 15px var(--mono);text-align:center;padding:0 6px;color-scheme:dark}
.cs-f input[readonly]{background:transparent;border-style:dashed;color:var(--muted)}
.cs-f input:focus{outline:2px solid var(--amber);outline-offset:-1px}
.cs-pax{display:grid;grid-template-columns:auto repeat(3,1fr);gap:6px;align-items:center}
.cs-pax b{font-size:12px;color:var(--muted);font-weight:500;min-width:44px}
.cs-pax input{height:38px;min-width:0;border-radius:10px;border:1px solid var(--line);background:var(--raise);color:var(--ink);font:600 14px var(--mono);text-align:center;color-scheme:dark}
.cs-chk{display:flex;flex-wrap:wrap;gap:6px}
.cs-chk button{font-size:12.5px;padding:7px 11px;border-radius:99px;border:1px solid var(--line);background:var(--raise);color:var(--muted);direction:ltr}
.cs-chk button.on{background:color-mix(in oklab,var(--go) 18%,var(--raise));border-color:color-mix(in oklab,var(--go) 50%,var(--line));color:var(--go)}
.cs-chk button.on::before{content:"✓ "}
.cs-act{display:grid;gap:8px;padding:10px 0;border-top:1px solid var(--line)}
.cs-act:first-of-type{border-top:0;padding-top:2px}
.cs-act .h{display:flex;justify-content:space-between;align-items:baseline;gap:8px;direction:ltr}
.cs-act .h b{font-size:14px;font-weight:600}
.cs-act .h small{font:500 12px var(--mono);color:var(--muted)}
.cs-act.done .h b::after{content:" ✓";color:var(--go)}
.cs-act.run .h b{color:var(--amber)}
.cs-tm{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:8px;direction:ltr}
.cs-tm.one{grid-template-columns:minmax(0,1fr)}

/* welcome / announcement */
.intro{cursor:pointer;position:fixed;inset:0;z-index:50;background:radial-gradient(120% 80% at 50% 0%,#14203a 0%,var(--night) 60%);display:grid;place-items:center;padding:24px;transition:opacity .5s var(--ease),transform .6s var(--ease)}

.eq{display:inline-flex;gap:3px;align-items:flex-end;height:16px}

.speaking .eq i:nth-child(2){animation-delay:.15s}.speaking .eq i:nth-child(3){animation-delay:.3s}.speaking .eq i:nth-child(4){animation-delay:.45s}

.trk{position:fixed;inset:0;z-index:30;background:var(--night);display:grid;grid-template-rows:auto 1fr auto}

#map{min-height:0;background:#0b1323}
.trk-card{padding:16px 16px calc(16px + env(safe-area-inset-bottom));background:var(--panel);border-top:1px solid var(--line);display:grid;gap:14px;border-radius:20px 20px 0 0;margin-top:-18px;position:relative;z-index:500;box-shadow:0 -10px 30px rgba(0,0,0,.35)}

.leaflet-container{font-family:var(--body);background:#0b1323}

const $=id=>document.getElementById(id);
/* arrival in the destination's local time (Egypt observes summer time) */
const ORIGIN={AJF:"الجوف",CAI:"القاهرة",JED:"جدة",SHJ:"الشارقة",RUH:"الرياض",ELQ:"القصيم",HMB:"سوهاج"};
const TZ_NAME={CAI:"مصر",HMB:"مصر",SHJ:"الإمارات"};
function lastDow(y,m,dow){const d=new Date(Date.UTC(y,m+1,0));while(d.getUTCDay()!==dow)d.setUTCDate(d.getUTCDate()-1);return d}
function destOffset(iata,date){
  if(iata==="SHJ"||iata==="DXB")return 4;
  if(iata==="CAI"||iata==="HMB"){const y=date.getUTCFullYear();return date>=lastDow(y,3,5)&&date<=lastDow(y,9,4)?3:2}
  return 3;
}
function arrival(f,date){
  const ksa=toMin(f.t||f.time)+f.dur,off=destOffset(f.iata,date||TODAY);
  return{local:fmt((ksa+(off-3)*60+1440)%1440),ksa:fmt(ksa%1440),foreign:off!==3,tz:TZ_NAME[f.iata]||""};
}

const reduce=matchMedia("(prefers-reduced-motion: reduce)").matches;
const pad=n=>String(n).padStart(2,"0");
const toMin=t=>{const[h,m]=t.split(":").map(Number);return h*60+m};
const fmt=m=>pad(Math.floor(m/60)%24)+":"+pad(m%60);
const norm=s=>s.toLowerCase().replace(/[أإآ]/g,"ا").replace(/ة/g,"ه").replace(/ى/g,"ي").replace(/\s+/g," ").trim();
const iso=d=>d.toISOString().slice(0,10);
const addDays=(d,n)=>new Date(d.getTime()+n*864e5);
const dLabel=d=>d.getUTCDate()+" "+MONTHS[d.getUTCMonth()];

function riyadhNow(){
  const p=Object.fromEntries(new Intl.DateTimeFormat("en-CA",{timeZone:"Asia/Riyadh",year:"numeric",month:"2-digit",day:"2-digit",hour:"2-digit",minute:"2-digit",hourCycle:"h23"}).formatToParts(new Date()).map(x=>[x.type,x.value]));
  return{date:new Date(Date.UTC(+p.year,+p.month-1,+p.day)),mins:+p.hour*60+ +p.minute};
}
let NOW=riyadhNow();
const TODAY=NOW.date;

/* what flies on a given date */
function flightsOn(date,{all=false}={}){
  const dow=date.getUTCDay(),k=iso(date);
  return FLIGHTS.filter(f=>f.days.includes(dow)&&(!f.until||k<=f.until)&&(all||!f.start||k>=f.start))
    .map(f=>({...f,t:f.alt&&f.alt[dow]||f.time,n:f.altNo&&f.altNo[dow]||f.no,ia:f.inAlt&&f.inAlt[dow]||f.inArr,ino:f.inAltNo&&f.inAltNo[dow]||f.inNo,off:!!(f.start&&k<f.start)}))
    .sort((a,b)=>a.t.localeCompare(b.t));
}

const LIVE_TXT={departed:["done","أقلعت"],landed:["done","أقلعت"],canceled:["cxl","ملغاة"],diverted:["cxl","تحويل"],delayed:["soon","متأخرة"],sched:["sched","في الموعد"]};

/* ---------- clock + next departure ---------- */
function renderClock(){
  NOW=riyadhNow();
  $("clock").textContent=fmt(NOW.mins);
  $("today").textContent=DAYS[NOW.date.getUTCDay()]+" "+dLabel(NOW.date);

function nextDeparture(){
  for(let i=0;i<21;i++){
    const d=addDays(TODAY,i);
    const f=flightsOn(d).find(f=>i>0||toMin(f.t)>NOW.mins);
    if(f)return{f,d,i,left:i*1440+toMin(f.t)-NOW.mins};
  }
}

  const prev=el.dataset.t;el.dataset.t=f.t;
  el.innerHTML=`<div class="lbl"><span class="pulse"><i></i>الرحلة القادمة</span><span>${when} · ${dLabel(d)}</span></div>

  if(prev!==f.t&&!reduce){el.querySelectorAll(".board span").forEach((sp,k)=>{const ch=sp.textContent;if(ch===":")return;const pool="0123456789";let n=0;const iv=setInterval(()=>{sp.textContent=pool[Math.floor(Math.random()*10)];sp.classList.remove("flip");void sp.offsetWidth;sp.classList.add("flip");if(++n>4+k*2){clearInterval(iv);sp.textContent=ch}},70)})}
}
function groundTrack(f,dayOffset){
  if(!f.ia||dayOffset!==0)return"";
  const a=toMin(f.ia),dep=toMin(f.t),now=NOW.mins;
  const L=LIVE.date===iso(TODAY)&&f.ino&&LIVE.flights[f.ino];
  let st,cls="st",pct;
  if(L&&L.s==="landed"){st="وصلت الجوف "+(L.t||"").replace("~","≈");cls+=" ok"}
  else if(L&&L.s==="canceled"){st="الوصول ملغى"}
  else if(now<a){const m=a-now;st=m>90?"الطائرة لم تصل بعد":"تصل بعد "+m+" د"}
  else{st="على الأرض";cls+=" ok"}
  pct=Math.max(0,Math.min(1,(now-a)/Math.max(1,dep-a)));
  if(now<a)pct=0;
  return`<div class="ground"><div class="gl"><span>وصول ${f.ino||""} <b>${f.ia}</b></span><span class="${cls}">${st}</span><span>إقلاع <b>${f.t}</b></span></div><div class="gbar"><i style="width:${(pct*100).toFixed(1)}%"></i><em style="right:${(pct*100).toFixed(1)}%"><svg viewBox="0 0 24 24" width="1em" height="1em" style="display:block;transform:rotate(-90deg)"><path fill="currentColor" d="M21 16v-2l-8-5V3.5a1.5 1.5 0 0 0-3 0V9l-8 5v2l8-2.5V19l-2 1.5V22l3.5-1 3.5 1v-1.5L13 19v-5.5z"/></svg></em></div></div>`;
}

/* ---------- week strip ---------- */
function renderWeek(){
  const start=addDays(TODAY,state.week*7),wk=$("week");
  const counts=[...Array(7)].map((_,i)=>flightsOn(addDays(start,i)).length),max=Math.max(...counts,1);
  wk.innerHTML="";
  counts.forEach((c,i)=>{
    const d=addDays(start,i),b=document.createElement("button");
    b.className="day"+(c===max&&c>0?" peak":"")+(iso(d)===iso(TODAY)?" today":"");
    b.setAttribute("aria-pressed",i===state.sel);
    b.setAttribute("aria-label",`${DAYS[d.getUTCDay()]} ${dLabel(d)}، ${c} رحلات`);
    b.innerHTML=`<span class="dn">${iso(d)===iso(TODAY)?"اليوم":SHORT[d.getUTCDay()]}</span><span class="dd">${d.getUTCDate()}</span>
      <span class="meter"><i style="height:${Math.max(4,c/max*34)}px"></i></span><span class="dc">${c}</span>`;
    b.onclick=()=>{state.sel=i;save();render()};
    wk.appendChild(b);
  });
  const end=addDays(start,6);
  $("weekTitle").textContent=state.week===0?"الأيام السبعة القادمة":state.week===1?"الأسبوع اللي بعده":`بعد ${state.week} أسابيع`;
  $("weekRange").textContent=`${dLabel(start)} – ${dLabel(end)} · ${counts.reduce((a,b)=>a+b,0)} رحلة`;
  $("prev").disabled=state.week===0;$("nextw").disabled=state.week>=7;
}

/* ---------- day timeline ---------- */
function renderTimeline(rows){
  const S=6*60,E=24*60,pos=m=>((Math.min(Math.max(m,S),E)-S)/(E-S)*100).toFixed(2)+"%";
  let html='<div class="track"><div class="axis"></div>';
  // busiest 2-hour window
  let best={n:0};
  rows.forEach(a=>{const s=toMin(a.t),w=rows.filter(b=>toMin(b.t)>=s&&toMin(b.t)<s+120);if(w.length>best.n)best={n:w.length,s,e:toMin(w[w.length-1].t)}});
  if(best.n>=3)html+=`<div class="rush" style="right:${pos(best.s-6)};width:calc(${pos(best.e+6)} - ${pos(best.s-6)})"></div>`;
  [6,9,12,15,18,21,24].forEach(h=>html+=`<span class="tick" style="right:${pos(h*60)}">${pad(h%24)}</span>`);
  const isToday=iso(selDate())===iso(TODAY);
  rows.forEach(f=>{const m=toMin(f.t);html+=`<span class="dot${isToday&&m<NOW.mins?" done":""}${f.est?" est":""}" style="right:${pos(m)}" title="${f.t} ${f.dest}"></span>`});
  if(isToday&&NOW.mins>=S)html+=`<span class="now" style="right:${pos(NOW.mins)}"></span>`;
  html+="</div>";
  html+=best.n>=3?`<p>أعلى ضغط: <b>${best.n} رحلات</b> بين <b class="num">${fmt(best.s)}</b> و<b class="num">${fmt(best.e)}</b></p>`
    :`<p>${rows.length?"الرحلات موزعة، ما فيه تكدس خلال ساعتين":"ما فيه رحلات هذا اليوم"}</p>`;
  $("tl").innerHTML=html;
}


/* inbound aircraft status at AJF from live.json (keyed by inbound flight number) */
/* تأخير الوصول = ATA − STA (يظهر بجانب وقت الوصول) */
function arrDlyTxt(f,t){
  const a=tm(t),s=toMin(f.ia);if(isNaN(a)||isNaN(s))return"";
  let d=(a-s+1440)%1440;if(d>720)d-=1440;
  return d>0?` · <span style="color:var(--warn)">تأخر <span class="num">${d}</span>د</span>`:"";
}
function inboundTxt(f,date){
  if(!f.ia)return"";
  const L=LIVE.date===iso(date)&&f.ino&&LIVE.flights[f.ino],man=MAN[ataKey(f,date)];
  if(man)return`<span style="color:var(--go)">وصلت <span class="num">${man}</span> ✎</span>${arrDlyTxt(f,man)}`;
  if(L){
    if(L.s==="landed")return`<span style="color:var(--go)">وصلت <span class="num">${(L.t||"").replace("~","≈")}</span></span>${arrDlyTxt(f,L.t||"")}`;
    if(L.s==="departed"){const e=L.t?tm(L.t):NaN;if(!isNaN(e)&&iso(date)===iso(TODAY)&&NOW.mins>e+10)return`<span style="color:var(--amber)">يُرجّح وصلت ≈<span class="num">${fmt(e)}</span> · لم يتأكد</span>`;
      return`<span style="color:#7cc4ff">في الجو${L.t?` · تصل <span class="num">${L.t.replace("~","≈")}</span>`:""}</span>`}
    if(L.s==="delayed")return`<span style="color:var(--amber)">تصل <span class="num">${L.t||""}</span></span>`;
    if(L.s==="canceled")return`<span style="color:var(--warn)">الوصول ملغى</span>`;
    if(L.s==="diverted")return`<span style="color:var(--warn)">تحويل</span>`;
  }
  return`يصل <span class="num">${f.ia}</span>`;
}

function flyBar(f,date){
  const L=iso(date)===iso(TODAY)&&LIVE.date===iso(TODAY)&&LIVE.flights[f.n];
  if(!L||L.s!=="departed"||!L.t)return"";
  if(NOW.mins-toMin(L.t)>f.dur)return"";
  const p=Math.max(.03,Math.min(.97,(NOW.mins-toMin(L.t))/f.dur));
  return`<div class="fly" aria-hidden="true"><i style="width:${(p*100).toFixed(1)}%"></i><em style="right:${(p*100).toFixed(1)}%"><svg viewBox="0 0 24 24" width="1em" height="1em" style="display:block;transform:rotate(-90deg)"><path fill="currentColor" d="M21 16v-2l-8-5V3.5a1.5 1.5 0 0 0-3 0V9l-8 5v2l8-2.5V19l-2 1.5V22l3.5-1 3.5 1v-1.5L13 19v-5.5z"/></svg></em></div>`;
}
/* ---------- board ---------- */
function hl(text){
  const t=state.q.trim();if(!t)return text;
  const i=norm(text).indexOf(norm(t));
  return i<0?text:text.slice(0,i)+"<mark>"+text.slice(i,i+t.length)+"</mark>"+text.slice(i+t.length);
}
function status(f,date){
  if(f.off)return["off","تبدأ "+dLabel(new Date(f.start+"T00:00:00Z"))];
  if(iso(date)!==iso(TODAY))return f.est?["sched","وقت تقديري"]:["sched","مجدولة"];
  const L=LIVE.date===iso(date)&&LIVE.flights[f.n];
  if(L&&LIVE_TXT[L.s]){const[c,w]=LIVE_TXT[L.s];return[c+" live",w+(L.t?" "+L.t.replace("~","≈"):"")]}
  const m=toMin(f.t);
  if(m<NOW.mins)return["sched","بانتظار التحديث"];
  if(m-NOW.mins<=120)return["soon","بعد "+(m-NOW.mins)+"د"];
  return["sched","مجدولة"];
}
function render(){
  const date=selDate();
  renderWeek();
  const active=flightsOn(date);
  const k=norm(state.q);
  let rows=k?flightsOn(date,{all:true}).filter(f=>norm([f.airline,f.n,f.dest,f.iata,f.t].join(" ")).includes(k)):flightsOn(date,{all:true});
  renderTimeline(active);
  $("dayTitle").textContent=DAYS[date.getUTCDay()]+" "+dLabel(date);
  const off=rows.filter(f=>f.off).length;
  $("dayNote").textContent=off===1?"رحلة متوقفة تظهر للعلم":off===2?"رحلتين متوقفتين تظهر للعلم":off?`${off} رحلات متوقفة تظهر للعلم`:"";
  $("sN").textContent=active.length;
  $("sF").textContent=active[0]?active[0].t:"—";
  $("sL").textContent=active.length?active[active.length-1].t:"—";
  const list=$("list");list.innerHTML="";
  if(!rows.length)list.innerHTML='<div class="empty">ما فيه رحلات تطابق البحث</div>';
  rows.forEach((f,i)=>{
    const [cls,txt]=status(f,date),b=document.createElement("button");
    b.className="row"+(cls.startsWith("done")?" past":"")+(cls==="off"?" off":"")+(cls.startsWith("cxl")?" cxl":"");
    b.style.setProperty("--c",f.c);b.style.animationDelay=Math.min(i*40,240)+"ms";
    b.innerHTML=`<div class="t">${hl(f.t)}<small>${inboundTxt(f,date)}</small></div>
      <div class="d"><b>${hl(f.dest)}</b><span class="code">${f.iata}</span><div><span class="al">${f.n.slice(0,2)}</span>${hl(f.airline)} · <span class="num">${hl(f.n)}</span></div></div>
${flyBar(f,date)}      <div class="side"><span class="chip ${cls}">${txt}</span>${turnChip(f,date)||gtTag(f,date)+dlyTag(f,date)}</div>`;
    b.onclick=()=>openSheet(f,date);
    list.appendChild(b);
  });
  renderSync();
}

const callsign=n=>n?(ICAO[n.slice(0,2)]||n.slice(0,2))+n.slice(2):"";
const R=Math.PI/180;
function gc(a,b,t){const[la1,lo1]=[a[0]*R,a[1]*R],[la2,lo2]=[b[0]*R,b[1]*R];
  const d=2*Math.asin(Math.sqrt(Math.sin((la2-la1)/2)**2+Math.cos(la1)*Math.cos(la2)*Math.sin((lo2-lo1)/2)**2));if(!d)return a;
  const A=Math.sin((1-t)*d)/Math.sin(d),B=Math.sin(t*d)/Math.sin(d);
  const x=A*Math.cos(la1)*Math.cos(lo1)+B*Math.cos(la2)*Math.cos(lo2),y=A*Math.cos(la1)*Math.sin(lo1)+B*Math.cos(la2)*Math.sin(lo2),z=A*Math.sin(la1)+B*Math.sin(la2);
  return[Math.atan2(z,Math.hypot(x,y))/R,Math.atan2(y,x)/R]}
function bearing(a,b){const y=Math.sin((b[1]-a[1])*R)*Math.cos(b[0]*R),x=Math.cos(a[0]*R)*Math.sin(b[0]*R)-Math.sin(a[0]*R)*Math.cos(b[0]*R)*Math.cos((b[1]-a[1])*R);return(Math.atan2(y,x)/R+360)%360}
function distKm(a,b){return 6371*2*Math.asin(Math.sqrt(Math.sin((b[0]-a[0])*R/2)**2+Math.cos(a[0]*R)*Math.cos(b[0]*R)*Math.sin((b[1]-a[1])*R/2)**2))}

function chime(){
  try{
    const ctx=new (window.AudioContext||window.webkitAudioContext)();
    [[659.25,0],[523.25,.42],[392,.84]].forEach(([f,t])=>{
      const o=ctx.createOscillator(),g=ctx.createGain();o.type="sine";o.frequency.value=f;
      g.gain.setValueAtTime(0,ctx.currentTime+t);g.gain.linearRampToValueAtTime(.28,ctx.currentTime+t+.02);
      g.gain.exponentialRampToValueAtTime(.001,ctx.currentTime+t+1.3);
      o.connect(g).connect(ctx.destination);o.start(ctx.currentTime+t);o.stop(ctx.currentTime+t+1.4);
    });
    return 1500;
  }catch(e){return 0}
}
function spokenTime(t){let[h,m]=t.split(":").map(Number);const p=h<12?"صباحاً":"مساءً";h=h%12||12;return h+(m===15?" والربع":m===30?" والنصف":m?" و"+m+" دقيقة":"")+" "+p}
function announcement(){
  const n=nextDeparture();
  if(!n)return{text:"أهلاً بكم في مطار الجوف."};
  const {f}=n;
  return{key:clipKey(f),text:`أهلاً بكم في مطار الجوف. الرحلة القادمة: الجوف، ${f.dest}، عند الساعة ${spokenTime(f.t)}.`};
}
/* recorded announcer clips available in audio/ (e.g. "CAI-0900"); others use the device voice */
const CLIPS=["welcome","next","CAI-SM","JED-SV","SHJ-G9","RUH-F3","ELQ-SV","RUH-XY","CAI-NP","HMB-SM","t0900","t0945","t1015","t1655","t1800","t1840","t1915","t2045","t2200","t2230"]; /* filled when announcer MP3s are uploaded, e.g. "SM322-0900" */
/* a flight's announcement = route clip (destination + airline) + time clip, so any day's time reuses the same voice */
const routeKey=f=>f.iata+"-"+f.no.slice(0,2);
const timeKey=f=>"t"+(f.t||f.time).replace(":","");
const clipKey=f=>routeKey(f);
const hasClip=f=>CLIPS.includes(routeKey(f))&&CLIPS.includes(timeKey(f));
let curAudio=null,seqId=0,introStop=null;
/* أي صوت جديد يوقف كل الأصوات الشغالة (بما فيها إعلان الافتتاح) حتى ما تتداخل */
function stopClips(){seqId++;try{curAudio&&curAudio.pause()}catch(e){}try{introStop&&introStop()}catch(e){}}
function playSeq(keys,el,onEnd){
  keys=keys.filter(k=>CLIPS.includes(k));if(!keys.length)return false;
  stopClips();const id=seqId;el&&el.classList.add("speaking");
  const next=i=>{
    if(id!==seqId)return;
    if(i>=keys.length){el&&el.classList.remove("speaking");onEnd&&onEnd();return}
    const au=new Audio("audio/"+keys[i]+".mp3");curAudio=au;
    au.onended=()=>setTimeout(()=>next(i+1),keys[i]==="next"?1000:120);au.onerror=()=>next(i+1);
    au.play().catch(()=>{el&&el.classList.remove("speaking")});
  };
  next(0);return true;
}
function playFlight(f,el,withWelcome){
  if(!hasClip(f))return false;
  return playSeq([...(withWelcome?["welcome"]:[]),routeKey(f),timeKey(f)],el);
}
function speak(text,onEnd){
  if(!("speechSynthesis" in window)){onEnd&&onEnd();return}
  const u=new SpeechSynthesisUtterance(text);u.lang="ar-SA";u.rate=.9;u.pitch=.95;
  const vs=speechSynthesis.getVoices().filter(v=>/^ar/i.test(v.lang));
  const v=vs.find(v=>/enhanced|premium|neural|maged|majed/i.test(v.name))||vs[0];if(v)u.voice=v;
  let fin=false;const end=()=>{if(!fin){fin=true;onEnd&&onEnd()}};
  u.onend=u.onerror=end;setTimeout(end,15000);
  speechSynthesis.speak(u);
}
/* must be called directly inside a tap: iOS only allows sound that starts from a user gesture */
function playAnnouncement(el){
  const a=announcement();
  const off=()=>el&&el.classList.remove("speaking");el&&el.classList.add("speaking");
  const nd=nextDeparture();
  if(nd&&hasClip(nd.f))return new Promise(r=>{if(!playSeq(["welcome","next",routeKey(nd.f),timeKey(nd.f)],el,r))r()});
  /* no recorded clip yet: airport chime only (device voices sound robotic) */
  const w=chime();setTimeout(off,w);
  const nx=$("next");nx.classList.remove("flash");void nx.offsetWidth;nx.classList.add("flash");
  return Promise.resolve();
}
addEventListener("pagehide",()=>{try{speechSynthesis.cancel()}catch(e){}});
function flipTo(word){
  const spans=[...$("flap").children],chars="ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789";
  spans.forEach((sp,i)=>{
    if(reduce){sp.textContent=word[i];return}
    let n=0;const max=8+i*5,iv=setInterval(()=>{sp.textContent=chars[Math.floor(Math.random()*chars.length)];if(++n>=max){clearInterval(iv);sp.textContent=word[i]}},55);
  });
}
function closeIntro(){
  const el=$("intro");el.classList.add("out");
  setTimeout(()=>{el.hidden=true},600);
}
function showIntro(){
  const el=$("intro");el.hidden=false;
  const n=nextDeparture();
  $("introNx").innerHTML=n?`<span>الرحلة القادمة</span><b>الجوف ← ${n.f.dest} · <span class="num" style="color:var(--amber);font-size:17px">${n.f.t}</span></b>`:"<span>ما فيه رحلات قريبة</span>";
  flipTo("AJF");
  /* فيلم الافتتاح: عاصفة فوق مطار الجوف والبرق يرسم خريطة المملكة، ثم صوت المذيع */
  const v=$("introV"),still=reduce||(navigator.connection&&navigator.connection.saveData);
  if(!still){v.src="media/storm.mp4";v.loop=true;v.muted=true;v.play().catch(()=>{})}
  let done=false;
  const enter=withSound=>{if(done)return;done=true;
    if(!withSound||still){if(withSound)playAnnouncement($("say"));v.pause();closeIntro();return}
    /* الصوتان يبدآن مع اللمسة نفسها (شرط iOS)، الرعد خافت تحت صوت المذيع */
    el.classList.add("cine");v.loop=false;v.currentTime=0;v.muted=false;v.volume=.45;
    v.play().catch(()=>{v.muted=true;v.play().catch(()=>{})});
    /* الافتتاحية: ترحيب فقط. الرحلة القادمة تُقال بعد الدخول للوحة — بنفس عنصر الصوت حتى يسمح بها iOS */
    /* iOS يمنع أي صوت يبدأ بعد اللمسة بثواني، فنفتح AudioContext مع اللمسة ونحمّل مقاطع الرحلة القادمة مسبقاً ونشغّلها منه بعد الدخول */
    const au=new Audio("audio/welcome.mp3");au.play().catch(()=>{});
    const srcs=[];let killed=false;
    introStop=()=>{killed=true;introStop=null;try{au.onended=null;au.pause()}catch(e){}srcs.forEach(x=>{try{x.stop()}catch(e){}});try{v.muted=true}catch(e){}$("say").classList.remove("speaking")};
    let ctx=null;try{if(navigator.audioSession)navigator.audioSession.type="playback"}catch(e){}
    try{ctx=new (window.AudioContext||window.webkitAudioContext)();const b=ctx.createBuffer(1,1,22050),sn=ctx.createBufferSource();sn.buffer=b;sn.connect(ctx.destination);sn.start(0);ctx.resume&&ctx.resume()}catch(e){ctx=null}
    const nd0=nextDeparture(),q=nd0&&hasClip(nd0.f)?["next",routeKey(nd0.f),timeKey(nd0.f)].filter(k=>CLIPS.includes(k)):[];
    const bufs=ctx?Promise.all(q.map(k=>fetch("audio/"+k+".mp3").then(r=>r.arrayBuffer()).then(ab=>new Promise((ok,no)=>ctx.decodeAudioData(ab,ok,no))))).catch(()=>null):Promise.resolve(null);
    let closed=false;
    const fin=()=>{if(closed)return;closed=true;v.pause();closeIntro();if(!q.length)return;
      const s=$("say");
      setTimeout(async()=>{if(killed)return;s.classList.add("speaking");const B=await bufs;if(killed){s.classList.remove("speaking");return}
        if(B&&ctx){try{await ctx.resume()}catch(e){}let t=ctx.currentTime+.05;B.forEach((bf,i)=>{const src=ctx.createBufferSource();srcs.push(src);src.buffer=bf;src.connect(ctx.destination);src.start(t);t+=bf.duration+(q[i]==="next"?1:.15)});setTimeout(()=>s.classList.remove("speaking"),(t-ctx.currentTime)*1000)}
        else{let i=0;const nx=()=>{if(killed)return;if(i>=q.length){s.classList.remove("speaking");introStop=null;return}au.src="audio/"+q[i++]+".mp3";au.play().catch(()=>s.classList.remove("speaking"))};au.onended=()=>setTimeout(nx,q[i-1]==="next"?1000:150);nx()}
      },700)};
    v.ontimeupdate=()=>{if(v.currentTime>=4.2)el.classList.add("cap-on")};
    v.onended=()=>{el.classList.add("cap-on");setTimeout(fin,900)};
    setTimeout(fin,12000);
  };
  el.onclick=()=>enter(true);
  $("introSkip").onclick=e=>{e.stopPropagation();enter(false)};
}
$("say").onclick=()=>playAnnouncement($("say"));
if("speechSynthesis" in window)speechSynthesis.getVoices();

  const b=document.createElement("div");b.textContent="وضع تجريبي · أوقات وهمية للعرض فقط";b.style.cssText="position:fixed;top:0;inset-inline:0;z-index:50;background:#ffb340;color:#1a1205;font:600 12px/26px system-ui;text-align:center";document.body.appendChild(b);
}else{loadLive();setInterval(()=>{if(!document.hidden)loadLive()},30000);document.addEventListener("visibilitychange",()=>{if(!document.hidden)loadLive()});}
if("serviceWorker" in navigator&&location.protocol==="https:")navigator.serviceWorker.register("sw.js").catch(()=>{});
setInterval(()=>{try{const before=NOW.mins;renderClock();if(NOW.mins!==before){renderNext();if(!open)render()}}catch(e){}},15000);
